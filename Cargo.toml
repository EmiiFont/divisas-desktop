[workspace]
resolver = "2"
members = ["crates/divisas-api", "crates/divisas-ui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
gpui = "0.2"

[profile.release]
lto = "thin"
